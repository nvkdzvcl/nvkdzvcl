name: Update profile city and metrics
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/decorations.yml, scripts/profile_metrics.py]
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  city:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Publish city
        run: |
          test -s profile-3d-contrib/profile-night-rainbow.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib
          if ! git diff --cached --quiet; then
            git commit -m "chore: update contribution city"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  metrics:
    needs: city
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate public-data infographic
        run: python3 scripts/profile_metrics.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
      - name: Publish infographic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/metrics.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update public profile infographic"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
