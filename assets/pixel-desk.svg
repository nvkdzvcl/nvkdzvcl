<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Catouis — midnight coding club</title><desc id="desc">A lavender pixel cat types at a glowing computer beside a steaming coffee under a starry window.</desc>
<defs><linearGradient id="room" x2="1" y2="1"><stop stop-color="#191829"/><stop offset="1" stop-color="#25213d"/></linearGradient><radialGradient id="glow"><stop stop-color="#89b4fa" stop-opacity=".16"/><stop offset="1" stop-color="#89b4fa" stop-opacity="0"/></radialGradient></defs>
<style>@media (prefers-reduced-motion: reduce) { .motion {display:none} }</style>
<rect width="1200" height="440" rx="24" fill="url(#room)"/>
<rect x="24" y="24" width="1152" height="392" rx="14" fill="none" stroke="#48405f"/>
<circle cx="50" cy="49" r="4" fill="#f38ba8"/><circle cx="66" cy="49" r="4" fill="#f9e2af"/><circle cx="82" cy="49" r="4" fill="#a6e3a1"/>
<text x="1124" y="54" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="2" fill="#a6adc8">CATOUIS / PERSONAL LAB</text>
<text x="65" y="134" font-family="monospace" font-size="15" letter-spacing="4" fill="#cba6f7">MIDNIGHT CODING CLUB</text>
<text x="60" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="86" font-weight="700" letter-spacing="-3" fill="#cdd6f4">Catouis<tspan fill="#f38ba8">.</tspan></text>
<text x="65" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#bac2de">Big ideas. Tiny pixels. Lots of AI.</text>
<rect x="65" y="310" width="358" height="42" rx="8" fill="#302a46"/>
<rect x="82" y="327" width="8" height="8" fill="#a6e3a1"/>
<text x="106" y="337" font-family="monospace" font-size="15" fill="#a6e3a1">STATUS: MAKING THINGS HAPPEN</text>
<text x="65" y="389" font-family="monospace" font-size="12" fill="#9399b2">PROMPT. BUILD. TEST. SHIP. REPEAT.</text>
<ellipse cx="874" cy="253" rx="265" ry="169" fill="url(#glow)"/>
